spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/librarydb
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[physical_naming_strategy]": org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        "[default_schema]": librarydb_schema
        "[format_sql]": true

  flyway:
    enabled: true
    locations: classpath:db/migration
    create-schemas: true
    init-sqls:
      - CREATE SCHEMA IF NOT EXISTS librarydb_schema
    schemas:
      - librarydb_schema
    default-schema: librarydb_schema
    table: flyway_schema_history_librarydb
    baseline-on-migrate: true
    baseline-version: 0
    placeholders:
      db_schema: librarydb_schema

queue:
  block-users:
    fixed-delay-ms: 5000

server:
  port: 8081


cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}